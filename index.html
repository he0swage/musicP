<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>musicP</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1db954">
    <link rel="apple-touch-icon" href="icons/icon-192.svg">
</head>

<body>

    <header class="app-header">
        <h1>musicP</h1>
    </header>

    <main class="app-grid">
        <!-- Left: Playlists / Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-top">
                <h3>Playlists</h3>
                <div id="playlist-input-container">
                    <input type="text" id="new-playlist-input" placeholder="New playlist name...">
                    <button id="create-playlist-btn" class="small-btn"><i class="fas fa-plus"></i></button>
                </div>
            </div>
            <div id="playlists-list" class="sidebar-list"></div>
        </aside>

        <!-- Center: Search + Results -->
        <section class="main-content">
            <div id="search-container" class="search-bar">
                <input type="text" id="search-input" placeholder="Search music on Spotify...">
                <button id="search-btn" class="search-btn"><i class="fas fa-search"></i></button>
            </div>

            <h2 class="section-title">Search Results</h2>
            <div id="song-list" class="results-grid"></div>
        </section>

        <!-- Right: Player -->
        <aside class="player-panel">
            <div id="youtube-player" class="youtube-player"></div>
            <div class="artwork" id="artwork">
                <div class="artwork-inner">
                    <i class="fas fa-music large-icon"></i>
                </div>
            </div>
            <div class="player-info">
                <div id="current-title" class="title">No song selected</div>
                <div class="controls">
                    <button id="play-btn" class="control-btn"><i class="fas fa-play"></i></button>
                    <button id="pause-btn" class="control-btn"><i class="fas fa-pause"></i></button>
                    <button id="skip-btn" class="control-btn"><i class="fas fa-step-forward"></i></button>
                </div>
                <input type="range" id="progress" value="0" class="progress-range">
                <a id="open-spotify-link" class="open-spotify" target="_blank" rel="noopener" href="#">Open in Spotify</a>
            </div>
        </aside>
    </main>

    <script src="index.js"></script>
</body>

</html>
